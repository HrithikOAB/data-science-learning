<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
</head>
<body>

    <h2>OTP Verification</h2>

    <p>
        We have sent a verification code to your registered email/mobile number.
    </p>

    <form action="{% url 'verify_otp' %}" method="POST">

        {% csrf_token %}

        <label for="otp">Enter OTP</label>
        <br><br>

        <input
            type="text"
            id="otp"
            name="otp"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
            required
        >
       
        <input
            type="text"
            id="number"
            name="user_number" 
            value={{user_number}}
            required
            readonly
        >
        <p>{{message}} <p>

        <br><br>

        <button type="submit">
            Verify OTP
        </button>

    </form>

    <br>

    <form action="{% url 'resend_otp' %}" method="POST">
        {% csrf_token %}
         <input
            type="hidden"
            id="number"
            name="user_number"
            value={{user_number}} 
        >
        <button type="submit">
            Resend OTP
        </button>
    </form>

    <br>

    <a href="{% url 'login' %}">
        Back to Login
    </a>

</body>
</html>
